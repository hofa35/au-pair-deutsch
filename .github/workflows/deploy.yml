# .github/workflows/deploy.yml
name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Erst prüfen, dann bauen. Ohne diesen Schritt fiel ein gebrochener
      # Test hier nicht auf, weil die CI nur den Build kannte.
      - run: node --test scripts/*.test.js
      - run: node scripts/pruefstand.js
      - run: node scripts/build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
